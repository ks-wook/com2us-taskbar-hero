# Taskbar Hero 모작 — 로컬 개발용 컨테이너(MySQL · Redis · Grafana · AccountServer · GameServer)
#
# 사용법
#   python server_up.py               # **권장** — 아무것도 묻지 않고 dev 구성을 띄운다(서버 이미지
#                                     #   재빌드 · 사전 점검 · 포트 충돌 확인 · healthy 대기 ·
#                                     #   MySQL 스키마 확인 · 보스러시 랭킹 캐시 적재).
#                                     #   dev(기본) = mysql · redis · accountserver · gameserver
#                                     #   full      = dev + timescaledb · fluentd · grafana (--mode full)
#                                     #   메뉴로 고르려면 -i
#   docker compose up -d --build      # 서버 이미지 빌드 + 전체 백그라운드 실행
#   docker compose up -d mysql redis  # 의존 서비스만(서버는 watch-all.ps1로 콘솔 실행할 때)
#   docker compose logs -f gameserver # 특정 서비스 로그 확인
#   docker compose build gameserver   # 코드 변경 후 서버 이미지 재빌드(재기동은 up -d)
#   docker compose down               # 중지(데이터는 볼륨에 유지)
#   docker compose down -v            # 중지 + 데이터 볼륨까지 삭제(완전 초기화)
#
# 두 서버 컨테이너는 호스트의 5160(AccountServer)·5247(GameServer)를 그대로 쓴다 —
# `watch-all.ps1`(dotnet watch 콘솔 실행)과 **포트가 겹치므로 둘 중 하나만 띄운다**.
# 핫 리로드로 개발할 때는 `docker compose up -d mysql redis`로 의존 서비스만 띄운 뒤
# watch-all.ps1을 쓰고(그 뒤 `python server_up.py --warmup-only`로 랭킹 캐시를 적재한다),
# 서버까지 컨테이너로 띄울 때는 `python server_up.py`를 쓴다.
# 서버 이미지는 소스를 COPY해 빌드하므로 코드를 고치면 재빌드해야 반영된다(핫 리로드 없음).
#
# 첫 기동 시 docs/의 스키마 SQL이 /docker-entrypoint-initdb.d 에서 알파벳 순으로 실행되어
# account/game/master DB를 생성한다. (init 스크립트는 데이터 볼륨이 비어 있을 때만 동작)
#
# AccountServer의 토큰 서명 키(Security:SecretKey)는 **이미지의 appsettings.json 기본값**을 쓴다 —
# 클론만 하면 준비물 없이 뜨게 하려는 것이다. 다른 키로 돌리려면 저장소 루트 `.env`(git 무시 대상)나
# 호스트 환경에 한 줄 넣으면 그 값이 전달돼 기본값을 덮어쓴다:
#   Security__SecretKey=<임의의 64자 정도 문자열>
# 콘솔 실행(dotnet run / watch-all.ps1)도 같은 appsettings를 읽으며, User Secrets를 두면 그쪽이 이긴다.
#
# Redis는 두 서버의 인증 토큰 캐시·배치 리더 락 저장소이며 127.0.0.1:36379로 노출한다(컨테이너 안은 6379)
# (appsettings의 `Redis:ConnectionString`과 동일). 저장소 내 Windows 바이너리
# `Redis-8.8.0-Windows-x64-cygwin-with-Service/`도 그대로 쓸 수 있으나, 같은 6379를
# 쓰므로 둘 중 하나만 띄운다.
#
# Grafana는 로그 뷰어 대시보드용이며 http://localhost:3000 (기본 계정 admin/admin)으로 접속한다.
# 서버와 독립적으로 뜨므로 `docker compose up -d grafana`만으로도 쓸 수 있다.
# 외부에서는 테일스케일로 본다 — 호스트에서 아래 한 줄을 띄워 두면 tailnet 안에서 접속된다:
#   tailscale serve --bg --https=10000 http://localhost:3000
# 컨테이너의 GF_SERVER_ROOT_URL·GF_SERVER_DOMAIN 이 그 주소와 맞아야 로그인 리다이렉트가 깨지지 않는다.
# 데이터소스(`logdb`)와 대시보드 5개는 `grafana/`에 **코드로 고정**해 두고 프로비저닝으로 붙인다
# (`grafana/provisioning/**`, `grafana/dashboards/*.json`). UI에서 고친 것은 정본이 아니므로,
# 남기려면 대시보드를 JSON으로 내보내 `grafana/dashboards/`에 덮어쓴다.
#
# 로그 파이프라인은 **GameServer(ZLogger JSON 파일) → fluentd → TimescaleDB(logdb) → Grafana**다
# (docs/공통/로그-이벤트-정의.md 3·8·9장).
#   · fluentd는 호스트의 `GameServer/logs/event/`를 in_tail로 걷는다 — 서버를 콘솔(`dotnet run`·
#     watch-all.ps1)로 띄우든 컨테이너로 띄우든 **같은 디렉터리**를 본다(gameserver 서비스가 그
#     경로를 바인드 마운트한다).
#   · timescaledb(`logdb`)는 첫 기동 시 `docs/공통/logdb-schema.sql`을 실행해 로그 테이블 31개
#     (액션 21 + unknown + 히스토리 9)와 하이퍼테이블·압축·보존·연속 집계를 만든다. 스키마를 고쳐
#     다시 적용하려면 `docker compose down -v`로 볼륨을 비우고 재기동한다(init은 빈 볼륨에서만 돈다).
#   · 로그 저장소만 따로 띄울 수 있다: `docker compose up -d timescaledb fluentd`.

services:
  mysql:
    image: mysql:8.4
    container_name: taskbar-hero-mysql
    restart: unless-stopped
    # MySQL 8은 기본 utf8mb4지만 서버 기본값을 스키마와 맞춰 명시한다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: taskbar_hero_dev
      TZ: Asia/Seoul
    ports:
      # **호스트 33306 → 컨테이너 3306.** 그 PC에 이미 깔린 로컬 MySQL(3306)과 부딪히지 않게
      # 호스트 쪽 번호만 옮겼다. 컨테이너 안 포트와 서버 컨테이너의 접속 문자열(`Server=mysql;Port=3306`)은
      # compose 네트워크 안이라 그대로다 — 바뀌는 것은 호스트에서 직접 붙을 때의 번호뿐이다.
      - "33306:3306"
    volumes:
      - taskbar-hero-mysql-data:/var/lib/mysql
      # 첫 기동 시 스키마 자동 생성(읽기 전용 마운트). 파일명 접두 숫자로 실행 순서 고정.
      - ./docs/공통/db-schema.sql:/docker-entrypoint-initdb.d/01-db-schema.sql:ro
      - ./docs/세부/master-data/master-data-schema.sql:/docker-entrypoint-initdb.d/02-master-data-schema.sql:ro
    # -h 127.0.0.1(TCP)로 검사한다 — init 스크립트를 실행하는 임시 서버는 소켓만 열고
    # 네트워킹을 끄므로, TCP를 보면 "스키마 생성이 끝난 뒤"에야 healthy가 된다.
    # 서버 컨테이너가 depends_on: service_healthy로 이 상태를 기다린다.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    container_name: taskbar-hero-redis
    restart: unless-stopped
    # 개발용이라 비밀번호 없이 로컬에만 노출한다(appsettings의 접속 문자열과 동일).
    # AOF를 켜서 컨테이너를 다시 띄워도 토큰·락 키가 남게 한다.
    command:
      - redis-server
      - --appendonly
      - "yes"
    environment:
      TZ: Asia/Seoul
    ports:
      # 호스트 루프백에만 바인딩(외부 노출 방지). **호스트 36379 → 컨테이너 6379** —
      # 로컬에 이미 도는 Redis(6379)나 저장소 내 윈도우 바이너리와 부딪히지 않게 옮겼다.
      - "127.0.0.1:36379:6379"
    volumes:
      - taskbar-hero-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── 로그 저장소 ──────────────────────────────────────────────────────
  #   logdb: 게임 로그 전용 TimescaleDB. 게임 DB(MySQL)와 **물리적으로 분리**되므로
  #   분석 질의가 서비스 DB의 커넥션·버퍼풀을 건드리지 않는다(로그 이벤트 정의 3장).
  #   **서버는 이 DB에 접속하지 않는다** — 적재는 fluentd(out_sql)만 한다.
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    container_name: taskbar-hero-timescaledb
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      # 이 컨테이너의 수퍼유저가 곧 fluentd 접속 계정이다(fluent.conf의 username fluentd).
      # 개발용 단독 인스턴스라 계정을 따로 쪼개지 않는다 — 하이퍼테이블·정책 생성에
      # 수퍼유저 권한이 필요하고, 접속자가 fluentd 하나뿐이다.
      POSTGRES_DB: logdb
      POSTGRES_USER: fluentd
      POSTGRES_PASSWORD: "${LOGDB_PASSWORD:-taskbar_hero_dev}"
    ports:
      # psql·Grafana를 호스트에서 붙일 수 있게 루프백에만 노출한다(게임 DB의 33306과 겹치지 않는다).
      - "127.0.0.1:5432:5432"
    volumes:
      - taskbar-hero-logdb-data:/var/lib/postgresql/data
      # 첫 기동 시 스키마 자동 생성(데이터 볼륨이 비어 있을 때만 실행). 이미지 자체의 init
      # 스크립트(000_*)가 먼저 돌아 timescaledb 확장을 준비하므로 접두 숫자를 그 뒤로 둔다.
      - ./docs/공통/logdb-schema.sql:/docker-entrypoint-initdb.d/01-logdb-schema.sql:ro
    # -h 127.0.0.1(TCP)로 검사한다 — init 스크립트를 실행하는 임시 서버는 유닉스 소켓만 열므로,
    # TCP를 보면 "스키마 생성이 끝난 뒤"에야 healthy가 된다(mysql과 같은 이유).
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "fluentd", "-d", "logdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    image: grafana/grafana:12.0.2
    container_name: taskbar-hero-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      # 로그인 계정. 기본은 admin/admin이며, .env에 GRAFANA_ADMIN_PASSWORD를 넣으면 덮어쓴다.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      # 개발용 단독 인스턴스라 가입을 막고 익명 접근도 열지 않는다.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 외부(테일스케일) 접속용 공개 주소. 그라파나가 만드는 절대 URL(로그인 리다이렉트·공유 링크·
      # 알림 링크)이 이 값을 쓰므로, 리버스 프록시 뒤에 두면 반드시 프록시가 노출하는 주소로 맞춘다 —
      # 비워 두면 http://localhost:3000 으로 리다이렉트해 외부 접속이 끊긴다.
      # 호스트에서 `tailscale serve --bg --https=10000 http://localhost:3000` 으로 프록시하는 전제다
      # (프록시가 호스트에서 돌기 때문에 아래 포트 바인딩은 루프백 그대로 두면 된다).
      # 다른 머신·테일넷에서는 .env 의 GRAFANA_ROOT_URL·GRAFANA_DOMAIN 으로 덮어쓴다.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://ksu864-1.tail961c4e.ts.net:10000/}"
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN:-ksu864-1.tail961c4e.ts.net}"
      # logdb 데이터소스 비밀번호. 프로비저닝 YAML이 ${LOGDB_PASSWORD}로 이 값을 보간한다
      # (비밀번호를 저장소 파일에 적지 않는다 — 로깅 규칙 §7과 같은 기준).
      LOGDB_PASSWORD: "${LOGDB_PASSWORD:-taskbar_hero_dev}"
    ports:
      # 그라파나 기본 포트. 호스트 루프백에만 바인딩한다 — 외부 공개는 테일스케일 프록시가 담당하므로
      # 이 포트를 0.0.0.0 으로 열 필요가 없다(기본 비밀번호가 admin이라 직접 노출은 피한다).
      - "127.0.0.1:3000:3000"
    volumes:
      # 사용자 설정(로그인·폴더·수동 편집)이 컨테이너를 다시 띄워도 남게 한다.
      - taskbar-hero-grafana-data:/var/lib/grafana
      # 데이터소스(logdb) · 대시보드 공급자 설정. 코드로 고정해 UI 수동 추가에 의존하지 않는다.
      # provisioning 폴더를 통째로 덮으면 이미지가 들고 있는 plugins·alerting 디렉터리가 사라져
      # 기동 로그에 "no such file or directory" 오류가 찍힌다 — 쓰는 하위 두 개만 마운트한다.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # 대시보드 JSON 정본. 공급자가 30초마다 다시 읽으므로 파일을 고치면 재기동 없이 반영된다.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      # 데이터소스가 가리키는 logdb가 준비된 뒤에 뜨게 한다(첫 화면에서 빈 패널을 보지 않도록).
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 로그 수집기 ──────────────────────────────────────────────────────
  #   GameServer가 쓰는 이벤트 로그 JSON을 걷어 logdb(TimescaleDB)의 이벤트별 테이블에 적재한다.
  #   설정 정본은 docs/공통/로그-이벤트-정의.md 9장이고, 이 서비스는 그 설정이 기대하는
  #   마운트·환경변수만 맞춘다(설정 파일은 이미지에 굽지 않고 여기서 마운트한다 —
  #   fluent.conf·conf.d를 고치면 `docker compose restart fluentd`로 반영된다).
  fluentd:
    build: ./fluentd
    image: taskbar-hero-fluentd
    container_name: taskbar-hero-fluentd
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      # logdb 접속 비밀번호. 설정 파일에 적지 않고 환경변수로 넣는다(로깅 규칙 §7).
      # 다른 서비스만 띄울 때도 컴포즈가 멈추지 않게 기본값을 둔다 — logdb를 올릴 때
      # .env의 LOGDB_PASSWORD로 덮어쓴다.
      LOGDB_PASSWORD: "${LOGDB_PASSWORD:-taskbar_hero_dev}"
    volumes:
      # 설정(읽기 전용). fluent.conf가 conf.d/*.conf를 @include 한다.
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./fluentd/conf.d:/fluentd/etc/conf.d:ro
      # 수집 대상: GameServer의 이벤트 로그 디렉터리(EventLog:Directory = logs/event).
      # 읽기만 하므로 :ro. 폴더가 없으면 도커가 만들지만, 서버를 한 번이라도 띄우면 생긴다.
      - ./GameServer/logs/event:/var/log/taskbarhero/event:ro
      # pos_file · 버퍼. **볼륨에 둬야** 컨테이너를 다시 만들어도 읽은 위치를 잃지 않는다
      # (잃으면 같은 파일을 처음부터 다시 읽어 중복 적재가 된다 — 9.3).
      - taskbar-hero-fluentd-state:/var/log/fluentd
    ports:
      # 계측 엔드포인트(in_monitor_agent). 수집이 밀리는지·전송이 재시도 중인지를
      # 컨테이너 안 파일을 뒤지지 않고 확인한다(`./pipeline-status.ps1`이 읽는다).
      # 호스트 루프백에만 바인딩한다 — 운영 정보라 외부에 열 이유가 없다.
      - "127.0.0.1:24220:24220"
    depends_on:
      # out_sql은 기동 시 logdb에 접속하므로, **스키마 생성이 끝난 뒤**(healthy) 떠야 한다.
      timescaledb:
        condition: service_healthy

  # ── 애플리케이션 서버 ────────────────────────────────────────────────
  #   두 서버 모두 저장소 루트를 빌드 컨텍스트로 삼는다(공통 라이브러리
  #   TaskbarHero.Common을 ProjectReference로 참조하기 때문).
  #   접속 문자열은 이미지에 굽지 않고 여기서 환경 변수로 덮어쓴다 — appsettings.json의
  #   localhost 대신 compose 네트워크의 서비스 이름(mysql·redis)을 가리켜야 한다.
  #   (`__`는 ASP.NET Core 설정 계층 구분자다: ConnectionStrings__GameDb ≡ ConnectionStrings:GameDb)
  accountserver:
    build:
      context: .
      dockerfile: AccountServer/Dockerfile
    image: taskbar-hero-accountserver
    container_name: taskbar-hero-accountserver
    restart: unless-stopped
    # 목록 형식을 쓴다 — 마지막 항목처럼 **값 없이 이름만** 적으면 "있으면 전달, 없으면 아예 설정하지
    # 않음"이 되는데, 이 문법이 목록 형식에만 있다.
    environment:
      - TZ=Asia/Seoul
      # Development로 둬야 /swagger·/openapi/v1.json이 매핑된다(로컬 개발용 컴포즈).
      - ASPNETCORE_ENVIRONMENT=Development
      # launchSettings.json(http 프로필)은 컨테이너 실행(dotnet AccountServer.dll)에
      # 적용되지 않으므로 수신 주소를 직접 지정한다. 호스트와 같은 포트를 써서 URL을 통일한다.
      - ASPNETCORE_URLS=http://+:5160
      - ConnectionStrings__AccountDb=Server=mysql;Port=3306;Database=taskbar_hero_account;Uid=root;Pwd=taskbar_hero_dev;
      - Redis__ConnectionString=redis:6379
      # 인증 토큰(HMAC-SHA256) 서명 키는 **이미지의 appsettings.json 기본값**을 쓴다 — 클론만 하면
      # 아무 준비 없이 뜨게 하려는 것이다(그래서 .env 준비물이 없다). 다른 키로 돌리려면 .env나
      # 호스트 환경에 `Security__SecretKey=<값>` 을 두면 그 값이 전달돼 기본값을 덮어쓴다.
      # 값이 없으면 컨테이너에 **설정 자체가 전달되지 않으므로**, 빈 문자열로 덮어써 버리는 사고가 없다
      # (map 형식의 "${VAR:-}" 는 빈 값으로 덮어쓴다 — 그래서 이 항목만은 목록 형식이 필요하다).
      - Security__SecretKey
    ports:
      - "5160:5160"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5160/openapi/v1.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gameserver:
    build:
      context: .
      dockerfile: GameServer/Dockerfile
    image: taskbar-hero-gameserver
    container_name: taskbar-hero-gameserver
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5247
      # 게임 DB + 마스터 DB(기동 시 인메모리로 적재) 두 개를 쓴다.
      ConnectionStrings__GameDb: "Server=mysql;Port=3306;Database=taskbar_hero_game;Uid=root;Pwd=taskbar_hero_dev;"
      ConnectionStrings__MasterDb: "Server=mysql;Port=3306;Database=taskbar_hero_master;Uid=root;Pwd=taskbar_hero_dev;"
      # 인증 토큰 조회(AccountServer가 넣은 토큰) + 주기 배치 리더 락 저장소.
      Redis__ConnectionString: "redis:6379"
    ports:
      - "5247:5247"
    volumes:
      # 이벤트 로그(집계용 JSON)를 호스트의 같은 폴더에 쓴다 — 콘솔 실행(dotnet run)이 쓰는
      # 경로와 하나로 합쳐 fluentd가 실행 방식과 무관하게 그 디렉터리만 tail 하면 된다.
      # 컨테이너 안 경로는 WORKDIR(/app) + EventLog:Directory(logs/event)다.
      - ./GameServer/logs/event:/app/logs/event
    depends_on:
      # 마스터 데이터를 기동 시 1회 적재하므로 MySQL이 healthy(= 스키마 생성 완료)여야 한다.
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5247/openapi/v1.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  taskbar-hero-mysql-data:
  taskbar-hero-redis-data:
  taskbar-hero-grafana-data:
  # fluentd의 pos_file(어디까지 읽었나) · DB 앞 파일 버퍼. 컨테이너 재생성에도 남아야 한다.
  taskbar-hero-fluentd-state:
  # 로그 저장소(TimescaleDB logdb) 데이터. `down -v`로 지우면 스키마 SQL이 다시 실행된다.
  taskbar-hero-logdb-data:
