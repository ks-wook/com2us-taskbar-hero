# ═══════════════════════════════════════════════════════════════════════
#  fluentd — Taskbar Hero 로그 수집기(1대)
#
#  정본: docs/공통/로그-이벤트-정의.md 9장. 이 파일은 그 문서의 9.5 전문을 그대로 옮긴 것이며,
#  구조는 셋으로 고정이다 — **입력(in_tail) → 태그 승격 → 적재(out_sql)**.
#  태그 → 테이블 매핑만 conf.d/*.conf 로 갈라 @include 한다(이벤트를 추가하면 그 파일에
#  <table> 한 블록만 늘어난다 — 9.4).
#
#  적재 대상 logdb(TimescaleDB)는 docker-compose의 `timescaledb` 서비스이며, fluentd는
#  그것이 healthy(= 스키마 생성 완료)가 된 뒤에 뜬다(depends_on). logdb가 내려가 있으면
#  아래 <match log.**> 가 접속에 실패해 재시작을 반복하지만, 서버가 쓴 JSON 파일이
#  1차 버퍼라(9.3) 그 사이 라인이 사라지지는 않는다 — pos_file이 읽은 위치를 기억한다.
# ═══════════════════════════════════════════════════════════════════════

# ── 입력: GameServer 가 쓰는 이벤트 JSON 파일(9.1) ─────────────────────
#   방출자가 GameServer 하나이므로 <source>도 하나다. 나중에 AccountServer를 합류시켜도
#   같은 디렉터리에 쓰게 하면 이 블록은 그대로다.
<source>
  @type tail
  path /var/log/taskbarhero/event/*.json
  pos_file /var/log/fluentd/event.pos
  tag event.raw
  # 새로 발견한 파일을 **처음부터** 읽는다. 날짜·용량으로 파일이 갈리는 sink라
  # (event-YYYYMMDD_000.json) false로 두면 파일 생성 ~ 발견 사이에 쓰인 라인이 사라진다.
  # 이미 읽은 구간은 pos_file이 막으므로 중복은 생기지 않는다.
  read_from_head true
  # 하루가 넘어가 새 파일이 생겼을 때 1분(기본값)까지 기다리지 않게 짧게 둔다.
  refresh_interval 5s
  <parse>
    @type json
    # 적재되는 시각은 fluentd가 읽은 시각이 아니라 **서버가 찍은 값**이어야 한다.
    # keep_time_key로 레코드에 timestamp를 남겨 out_sql의 컬럼 매핑에 그대로 쓴다.
    time_key timestamp
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%L%z
    keep_time_key true
  </parse>
</source>

# ── 방어: tag 필드가 없는 라인도 버리지 않는다 ─────────────────────────
#   아래 rewrite_tag_filter 는 규칙에 걸리지 않는 레코드를 조용히 버린다.
#   tag 를 못 낸 라인(방출 코드 버그)이 사라지면 손실을 알 방법이 없으므로,
#   여기서 unknown 으로 채워 기본 테이블(맨 아래)까지 흘려보낸다.
<filter event.raw>
  @type record_transformer
  enable_ruby
  <record>
    tag ${record["tag"] || "unknown"}
  </record>
</filter>

# ── 라우팅: 레코드의 tag 를 fluentd 태그로 승격(9.2) ───────────────────
<match event.raw>
  @type rewrite_tag_filter
  <rule>
    key     tag
    pattern /^(.+)$/
    tag     log.$1
  </rule>
</match>

# ── 적재: logdb(TimescaleDB) ──────────────────────────────────────────
<match log.**>
  @type sql
  host timescaledb
  port 5432
  database logdb
  adapter postgresql
  username fluentd
  # 비밀번호는 설정 파일에 적지 않는다(로깅 규칙 §7과 같은 기준) — 컨테이너 환경변수로 받는다.
  password "#{ENV['LOGDB_PASSWORD']}"

  # 태그 → 테이블 매핑. 도메인별 파일로 갈라 둔다(ERD 8.2~8.7 과 1:1).
  # 파일명 접두 숫자로 include 순서를 고정한다 — <table> 은 위에서부터 먼저
  # 매칭되므로, 순서가 흔들리면 어느 블록이 이기는지도 흔들린다.
  @include conf.d/*.conf

  # 기본 테이블: 위 어느 패턴에도 안 걸린 태그가 여기로 온다(5·7장 카탈로그 누락 탐지).
  # 패턴 없는 <table> 이 기본값이므로 **반드시 include 뒤**에 둔다.
  <table>
    table unknown_event_logs
    column_mapping 'timestamp:timestamp,tag:tag,uid:uid'
  </table>

  <buffer>
    @type file
    path /var/log/fluentd/buf/logdb
    chunk_limit_size 2m
    flush_interval 10s
    retry_max_times 5
  </buffer>
</match>

# 여기까지 안 걸리는 것은 없어야 한다(있으면 설정 오류라 눈에 보이게 찍는다).
<match **>
  @type stdout
</match>
